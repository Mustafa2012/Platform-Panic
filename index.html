
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Platform Panic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
<div id="startScreen">
  <img src="Images/Logo.png" alt="Platform Panic Logo" id="gameLogo">
  <button id="playButton">Play</button>
</div>

<div id="roundScreen" style="display:none;">
  <header class="round-header">
    <nav class="round-tabs" aria-label="Choose a round">
      <button class="round-tab selected" type="button" data-round="1" aria-pressed="true" onclick="selectRound(1)">Training Grounds</button>
      <button class="round-tab" type="button" data-round="2" aria-pressed="false" onclick="selectRound(2)">Robot Factory</button>
    </nav>
  </header>
  <div class="level-map">
    <svg class="map-route" viewBox="0 0 1000 420" preserveAspectRatio="none" aria-hidden="true">
      <path class="route-base" d="M80 310 C145 310 150 105 220 105 S295 285 360 285 S435 105 500 105 S575 285 640 285 S715 105 780 105 S855 285 920 285"></path>
      <path class="route-dash" d="M80 310 C145 310 150 105 220 105 S295 285 360 285 S435 105 500 105 S575 285 640 285 S715 105 780 105 S855 285 920 285"></path>
    </svg>
    <div id="levelNodes" class="level-nodes" aria-label="Levels"></div>
   
  </div>
</div>




<div id="controls" style="display:none;">
</div>



 <div id="gameArea">
  <h1 id="roundGameHeading">Robot Factory</h1>
  <canvas id="game" width="800" height="400"></canvas>
</div>

<!-- Sound Toggle Button -->
<button
  id="soundToggle"
  type="button"
  aria-label="Mute sound"
  title="Mute sound"
  aria-pressed="false"
  style="display: none;"
>
  🔊
</button>

<!-- Level Complete Screen -->
<section
  id="levelCompleteScreen"
  role="dialog"
  aria-modal="true"
  aria-labelledby="completionTitle"
  style="display: none;"
>
  <div class="completion-card">
    <h1 id="completionTitle">Level Complete!</h1>
    <p id="completionStage" class="completion-stage"></p>

    <div class="completion-stats">
      <div>
        <span>Time</span>
        <strong id="completionTime"></strong>
      </div>

      <div>
        <span id="completionScoreLabel">Score</span>
        <strong id="completionScore"></strong>
      </div>

      <div>
        <span id="completionCoinsLabel">Batteries</span>
        <strong id="completionCoins"></strong>
      </div>
    </div>

    <div
      id="completionStars"
      class="completion-stars"
      aria-label="Level rating"
    ></div>

    <div class="completion-actions">
      <button
        id="completionReplay"
        type="button"
        aria-label="Replay this level"
        disabled
      >
        <span aria-hidden="true">↻</span>
      </button>

      <button
        id="completionContinue"
        type="button"
        aria-label="Choose a level"
        disabled
      >
        <span aria-hidden="true">☷</span>
      </button>

      <button
        id="completionNext"
        type="button"
        aria-label="Next level"
        disabled
      >
        <svg
          class="completion-next-icon"
          aria-hidden="true"
          viewBox="0 0 32 32"
        >
          <path d="M5 16h21M17 7l9 9-9 9"></path>
        </svg>
      </button>
    </div>
  </div>
</section>

<script src="game.js"></script>

</body>
</html>
